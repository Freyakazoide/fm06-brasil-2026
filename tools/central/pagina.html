<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Desenvolvimento</title>
  <link rel="stylesheet" href="/central.css">
</head>
<body>
  <header class="app-header">
    <button class="brand" id="academy-home" type="button" title="Visão da base">
      <img src="/emblema.png" alt="">
      <span><strong>Centro de Desenvolvimento</strong><small>Análise e planejamento dos jovens do clube</small></span>
    </button>
    <div class="header-summary" id="header-summary"></div>
    <div class="header-actions">
      <span id="when">—</span>
      <button class="primary" id="reload" type="button">Atualizar do jogo</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="talent-sidebar">
      <div class="sidebar-title"><strong>Jovens</strong><span id="result-count">—</span></div>
      <div class="tools">
        <input id="search" type="search" placeholder="Buscar jogador…" autocomplete="off">
        <select id="sort" aria-label="Ordenar jogadores">
          <option value="prioridade">Prioridade</option>
          <option value="prontidao">Prontidão</option>
          <option value="pot">Potencial</option>
          <option value="hab">Habilidade</option>
          <option value="idade">Idade</option>
          <option value="nome">Nome</option>
        </select>
      </div>
      <div class="filters" id="filters"></div>
      <div id="cards" class="player-list"></div>
    </aside>

    <section class="workspace" id="workspace">
      <div class="loading">Lendo o jogo…</div>
    </section>
  </main>

  <footer>Lido ao vivo da memória do jogo, somente para leitura. Estrelas, projeções e indicadores são opiniões da comissão.</footer>
  <script src="/central.js"></script>
</body>
</html>
