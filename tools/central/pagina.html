<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Desenvolvimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/central.css">
</head>
<body>
  <header class="app-header">
    <button class="brand" id="academy-home" type="button" title="Visão da base">
      <span class="fm-mark" aria-hidden="true"><b>FM</b><i>06</i></span>
      <span class="brand-copy"><small>FOOTBALL MANAGEMENT / YOUTH SYSTEM</small><strong>Centro de Desenvolvimento</strong></span>
    </button>
    <span class="brand-divider"></span>
    <img class="club-mark" src="/emblema.png" alt="">
    <div class="header-summary" id="header-summary"></div>
    <div class="header-actions">
      <span id="when">—</span>
      <button class="primary" id="reload" type="button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 8a8 8 0 0113 3M18 16A8 8 0 015 13"/></svg>Atualizar do jogo</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="talent-sidebar">
      <div class="sidebar-title"><strong><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20v-2c0-3 2.5-5 6-5s6 2 6 5v2M15 14c3 0 5 1.5 5 4v2"/></svg>Jovens monitorados</strong><span id="result-count">—</span></div>
      <div class="tools">
        <label class="search-box"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg><input id="search" type="search" placeholder="Buscar jogador…" autocomplete="off"></label>
        <select id="sort" aria-label="Ordenar jogadores">
          <option value="prioridade">Prioridade</option>
          <option value="prontidao">Prontidão</option>
          <option value="pot">Potencial</option>
          <option value="hab">Habilidade</option>
          <option value="idade">Idade</option>
          <option value="nome">Nome</option>
        </select>
      </div>
      <div class="filters" id="filters"></div>
      <div id="cards" class="player-list"></div>
    </aside>

    <section class="workspace" id="workspace">
      <div class="loading">Lendo o jogo…</div>
    </section>
  </main>

  <footer>Lido ao vivo da memória do jogo, somente para leitura. Estrelas, projeções e indicadores são opiniões da comissão.</footer>
  <script src="/central.js"></script>
</body>
</html>
