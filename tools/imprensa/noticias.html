<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central de Notícias</title>
  <link rel="stylesheet" href="/central.css">
  <link rel="stylesheet" href="/noticias.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/noticias" title="Central de Notícias">
      <span class="fm-mark" aria-hidden="true"><b>FM</b><i>06</i></span>
      <span class="brand-copy"><small>FOOTBALL MANAGEMENT / NEWS CENTRE</small><strong>Central de Notícias</strong></span>
    </a>
    <span class="brand-divider"></span>
    <img class="club-mark" src="/emblema.png" alt="">
    <div class="header-summary" id="header-summary"></div>
    <div class="header-actions">
      <span id="when">—</span>
      <a class="primary" href="/"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11M8 10l4 4 4-4"/><rect x="5" y="15" width="14" height="6" rx="1"/></svg>Sala de Imprensa</a>
    </div>
  </header>

  <main class="app-shell">
    <aside class="talent-sidebar">
      <div class="sidebar-title"><strong><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 7l9 6 9-6"/></svg>Caixa de entrada</strong><span id="result-count">—</span></div>
      <div class="tools news-tools">
        <label class="search-box"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg><input id="search" type="search" placeholder="Buscar manchete…" autocomplete="off"></label>
      </div>
      <div class="filters" id="modules"></div>
      <div class="filters" id="filters"></div>
      <div id="cards" class="player-list"></div>
    </aside>

    <section class="workspace" id="workspace">
      <div class="loading">Lendo a caixa do jogo…</div>
    </section>
  </main>

  <footer id="footer">Lido ao vivo da caixa de entrada do jogo. Notícia que pede resposta fica no jogo até o módulo dela saber responder.</footer>
  <script src="/noticias.js"></script>
</body>
</html>
